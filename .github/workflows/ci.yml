name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "ruff>=0.1.0" "pytest>=7.0.0" "pytest-cov>=4.0.0"

      - name: Lint with Ruff
        run: >-
          ruff check gmail_organizer/ app.py scripts/validate_gmail_organizer_runtime.py
          tests/launcher_test_support.py tests/test_runtime_validator.py
          tests/test_powershell_launcher.py tests/assert_python_validator_coverage.py
          tests/run_stdlib_validator_coverage.py

      - name: Run tests
        run: python -m pytest tests/ -v

  windows-launcher:
    name: Native Windows Launcher
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify PowerShell 7
        shell: pwsh
        run: |
          $version = & pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
            throw 'PowerShell 7 is required for the native launcher CI job.'
          }
          Write-Host "PowerShell $version"

      - name: Install declared launcher test dependencies
        shell: pwsh
        run: >-
          python -m pip install "pytest>=7.0.0" "pytest-cov>=4.0.0"

      - name: Run native launcher and validator tests
        shell: pwsh
        run: |
          $powershellCoverage = Join-Path $env:RUNNER_TEMP 'launcher-powershell-coverage.csv'
          $pythonCoverage = Join-Path $env:RUNNER_TEMP 'validator-python-coverage.json'
          $env:GMAIL_ORGANIZER_PS_COVERAGE_FILE = $powershellCoverage
          python -m pytest tests/test_runtime_validator.py tests/test_powershell_launcher.py `
            -vv --strict-markers --cov=scripts.validate_gmail_organizer_runtime `
            --cov-branch --cov-report=term-missing --cov-report="json:$pythonCoverage"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          python tests/assert_python_validator_coverage.py `
            --coverage-json $pythonCoverage `
            --source scripts/validate_gmail_organizer_runtime.py `
            --minimum 80
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & ./tests/assert_powershell_launcher_coverage.ps1 `
            -LauncherPath scripts/launch_gmail_organizer.ps1 `
            -CoverageFile $powershellCoverage `
            -Minimum 80

  website:
    name: Website (Vite + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
